---
- name: Préparation du socle système pour Kubernetes
  hosts: k8s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Désactiver le swap immédiatement
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | default(0) | int > 0
      changed_when: false

    - name: Désactiver le swap de manière persistante dans fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Charger les modules kernel nécessaires à Kubernetes
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Charger les modules kernel au démarrage
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Configurer les paramètres sysctl pour Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
      loop:
        - key: net.bridge.bridge-nf-call-iptables
          value: "1"
        - key: net.bridge.bridge-nf-call-ip6tables
          value: "1"
        - key: net.ipv4.ip_forward
          value: "1"

    - name: Installer les dépendances système
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - iptables
        state: present
        update_cache: true
        cache_valid_time: 3600
