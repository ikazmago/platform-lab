---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo-service
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/part-of: platform-lab
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
