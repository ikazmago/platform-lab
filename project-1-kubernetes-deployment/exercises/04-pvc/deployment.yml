---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-demo
  namespace: demo
  labels:
    app: pvc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-demo
  template:
    metadata:
      labels:
        app: pvc-demo
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Premier démarrage du pod" > /data/message.txt
              date >> /data/message.txt
              echo "Contenu du volume :"
              cat /data/message.txt
              while true; do sleep 3600; done
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: demo-pvc
