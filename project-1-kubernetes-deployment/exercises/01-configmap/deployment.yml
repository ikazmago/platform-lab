---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-demo
  namespace: demo
  labels:
    app: configmap-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-demo
  template:
    metadata:
      labels:
        app: configmap-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=== Configuration de l'application ==="
              echo "APP_MESSAGE=$APP_MESSAGE"
              echo "APP_ENV=$APP_ENV"
              echo "=== Fin de la configuration ==="
              # Boucle infinie pour garder le pod en vie
              while true; do sleep 3600; done
          envFrom:
            - configMapRef:
                name: app-config
