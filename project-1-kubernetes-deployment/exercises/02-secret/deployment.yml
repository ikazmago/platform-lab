---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
  namespace: demo
  labels:
    app: secret-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-demo
  template:
    metadata:
      labels:
        app: secret-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=== Secrets de l'application ==="
              echo "DB_PASSWORD=$DB_PASSWORD"
              echo "API_TOKEN=$API_TOKEN"
              echo "=== Fin des secrets ==="
              while true; do sleep 3600; done
          envFrom:
            - secretRef:
                name: app-secret
